<VirtualHost *:80>
    ServerName redesign-reg.kmutnb.ac.th
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/reDesign-REG/web-app/public
    ErrorLog /var/log/apache2/redesign-reg.kmutnb.ac.th-error.log
    CustomLog /var/log/apache2/redesign-reg.kmutnb.ac.th-access.log combined

    Alias /.well-known/acme-challenge/ /var/www/reDesign-REG/web-app/public/.well-known/acme-challenge/
    <Directory /var/www/reDesign-REG/web-app/public/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    Alias /storage/ /var/www/reDesign-REG/web-app/storage/
    <Directory /var/www/reDesign-REG/web-app/storage>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://redesign-reg.kmutnb.ac.th%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
