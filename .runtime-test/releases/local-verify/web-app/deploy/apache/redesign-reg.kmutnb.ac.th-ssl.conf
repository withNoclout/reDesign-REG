<VirtualHost *:443>
    ServerName redesign-reg.kmutnb.ac.th
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/reDesign-REG/web-app/public
    ErrorLog /var/log/apache2/redesign-reg.kmutnb.ac.th-ssl-error.log
    CustomLog /var/log/apache2/redesign-reg.kmutnb.ac.th-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/redesign-reg.kmutnb.ac.th/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/redesign-reg.kmutnb.ac.th/privkey.pem

    Alias /.well-known/acme-challenge/ /var/www/reDesign-REG/web-app/public/.well-known/acme-challenge/
    <Directory /var/www/reDesign-REG/web-app/public/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    Alias /storage/ /var/www/reDesign-REG/web-app/storage/
    <Directory /var/www/reDesign-REG/web-app/storage>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "redesign-reg.kmutnb.ac.th"

    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3333/ retry=0 connectiontimeout=5 timeout=600 keepalive=On
    ProxyPassReverse / http://127.0.0.1:3333/

    <Location /dbadmin>
        Require all denied
    </Location>
</VirtualHost>
